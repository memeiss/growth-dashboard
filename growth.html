<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth 매출 대시보드 - 준비 중</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root {
  --accent: #7C3AED;
  --text: #0F172A;
  --text2: #475569;
  --muted: #94A3B8;
  --bg: #F1F5F9;
  --surface: #FFFFFF;
  --surface2: #F8FAFC;
  --border: #E2E8F0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
.placeholder{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px 40px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 20px rgba(15,23,42,0.06);
}
.badge-icon{
  width: 72px; height: 72px;
  margin: 0 auto 24px;
  background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 60%, white) 100%);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #fff;
  letter-spacing: -0.5px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}
.placeholder h1{
  font-size: 24px; font-weight: 800;
  color: var(--text); letter-spacing: -0.4px;
  margin-bottom: 8px;
}
.placeholder .subtitle{
  font-size: 13px; color: var(--muted); font-weight: 600;
  margin-bottom: 28px;
}
.placeholder p{
  font-size: 14px; color: var(--text2); font-weight: 500;
  line-height: 1.7;
  margin-bottom: 24px;
}
.status-pill{
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800;
  padding: 5px 12px;
  border-radius: 99px;
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 20px;
}
.status-pill::before {
  content: '🔒'; font-size: 10px;
}
.features{
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px dashed var(--border);
}
.features span{
  font-size: 11px; font-weight: 700;
  padding: 5px 12px; border-radius: 6px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border);
}
</style>
</head>
<body>

<div class="placeholder">
  <div class="badge-icon">GR</div>
  <span class="status-pill">준비 중</span>
  <h1>Growth 매출 대시보드</h1>
  <div class="subtitle">그로스 마케팅 · 캠페인 성과 · ROAS</div>
  <p>이 대시보드는 현재 준비 중입니다.<br>곧 OMNI · Sales와 동일한 형태의 매출 분석 화면이 제공될 예정입니다.</p>
  <div class="features">
    <span>캠페인별 ROAS</span>
        <span>CPA 추이</span>
        <span>신규 vs 재구매</span>
        <span>채널별 전환율</span>
        <span>광고비 효율</span>
  </div>
</div>

</body>
</html>
