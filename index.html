<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출 통합 대시보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --blue:    #25347A;
  --blue-2:  #3B4FB8;
  --blue-lt: #EFF3FF;
  --green:   #16A34A;
  --green-lt:#F0FDF4;
  --red:     #DC2626;
  --red-lt:  #FEF2F2;
  --amber:   #D97706;
  --amber-lt:#FFFBEB;
  --text:    #0F172A;
  --text2:   #475569;
  --muted:   #94A3B8;
  --bg:      #F1F5F9;
  --surface: #FFFFFF;
  --surface2:#F8FAFC;
  --border:  #E2E8F0;
  --border-2:#CBD5E1;
  --shadow:  0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg: 0 10px 30px rgba(15,23,42,0.10);

  --tab-growth: #7C3AED;
  --tab-sales:  #0891B2;
  --tab-omni:   #25347A;
  --tab-brand:  #EA580C;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  display: flex; flex-direction: column;
}

/* ════════ TOP BAR ════════ */
.top-bar{
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
  flex-shrink: 0;
}
.top-inner{
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 32px; gap: 14px; flex-wrap: wrap;
}
.top-left { display:flex; align-items:center; gap: 12px;}
.top-icon{
  width: 34px; height: 34px;
  background: rgba(255,255,255,0.18);
  border-radius: 8px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink: 0;
}
.top-text h3 { color:#fff; font-size:13px; font-weight:700; letter-spacing:-0.2px;}
.top-text p  { color: rgba(255,255,255,0.78); font-size:11px; margin-top:2px; font-weight:500;}

.top-right{ display:flex; align-items:center; gap: 10px; flex-wrap: wrap;}
.top-btn{
  display:inline-flex; align-items:center; gap:7px;
  background:#fff; color: var(--blue);
  border:none; padding: 8px 16px;
  border-radius: 7px; font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  transition: all 0.18s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  text-decoration: none;
}
.top-btn:hover{ background: var(--blue-lt); transform: translateY(-1px);}
.top-btn svg{ width: 14px; height: 14px;}
.top-btn.outline{
  background: transparent; color: #fff;
  border: 1.5px solid rgba(255,255,255,0.4);
  box-shadow: none;
}
.top-btn.outline:hover{ background: rgba(255,255,255,0.12); border-color: #fff;}
#fileInput{ display: none; }

.top-status{
  color: rgba(255,255,255,0.92);
  font-size: 12px;
  display: flex; align-items: center; gap: 7px;
  font-weight: 500;
}
.status-dot{
  width: 7px; height: 7px; border-radius: 50%;
  background: #86EFAC;
  animation: statusPulse 2s infinite;
}
.status-dot.connecting{ background: #FCD34D; }
.status-dot.error{ background: #FCA5A5; }
@keyframes statusPulse {
  0%, 100% { opacity: 1; transform: scale(1);}
  50% { opacity: 0.55; transform: scale(1.4);}
}

/* ════════ TAB BAR ════════ */
.tab-bar{
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: center;
  padding: 14px 32px 10px;
  flex-shrink: 0;
}
.tab-nav{
  display: inline-flex;
  background: var(--surface2);
  border-radius: 99px;
  padding: 5px;
  border: 1px solid var(--border);
}
.tab-btn{
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--text2);
  padding: 9px 24px;
  border-radius: 99px;
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: all 0.2s ease;
  display: inline-flex; align-items: center; gap: 7px;
}
.tab-btn:hover:not(.active){
  color: var(--text);
  background: rgba(15,23,42,0.04);
}
.tab-btn.active{ color: #fff; }
.tab-btn[data-tab="growth"].active{ background: var(--tab-growth);}
.tab-btn[data-tab="sales"].active { background: var(--tab-sales); }
.tab-btn[data-tab="omni"].active  { background: var(--tab-omni);  }
.tab-btn[data-tab="brand"].active { background: var(--tab-brand); }

.tab-dot{
  width: 7px; height: 7px; border-radius: 50%;
}
.tab-btn[data-tab="growth"] .tab-dot{ background: var(--tab-growth); }
.tab-btn[data-tab="sales"]  .tab-dot{ background: var(--tab-sales); }
.tab-btn[data-tab="omni"]   .tab-dot{ background: var(--tab-omni); }
.tab-btn[data-tab="brand"]  .tab-dot{ background: var(--tab-brand); }
.tab-btn.active .tab-dot{ background: rgba(255,255,255,0.85); }

/* ════════ MAIN FRAME ════════ */
.main-frame{
  flex: 1;
  position: relative;
  overflow: hidden;
}
.dash-frame{
  width: 100%; height: 100%;
  border: none;
  background: var(--bg);
  display: block;
}
.dash-frame.hidden{ display: none; }

.frame-loading{
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  z-index: 5;
  transition: opacity 0.25s ease;
}
.frame-loading.hidden{ opacity: 0; pointer-events: none; }
.spinner{
  width: 36px; height: 36px;
  border: 3px solid var(--surface2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg);} }
.frame-loading .txt{
  font-size: 13px; font-weight: 700; color: var(--text2);
}

.toast{
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: #fff;
  font-size: 13px; font-weight: 600;
  padding: 10px 18px;
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 9999;
}
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 820px){
  .top-inner{ padding: 10px 16px;}
  .tab-bar{ padding: 12px 16px;}
  .tab-btn{ padding: 8px 16px; font-size: 12px;}
  .top-text p{ display: none;}
}
</style>
</head>
<body>

<!-- ════════ TOP BAR ════════ -->
<div class="top-bar">
  <div class="top-inner">
    <div class="top-left">
      <div class="top-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="top-text">
        <h3>엑셀 데이터 연동</h3>
        <p>제공된 엑셀 양식을 업로드하면 대시보드가 자동으로 업데이트됩니다</p>
      </div>

    <div class="top-right">
      <div class="top-status">

        <span id="dbStatusText">Firebase 연결 중…</span>
      </div>
      <a href="OMNI_월매출_업로드양식.xlsx" download class="top-btn outline" id="downloadTemplateBtn" title="현재 탭의 엑셀 양식 다운로드">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        엑셀 파일 업로드
      </button>
    </div>
  </div>
</div>

<!-- ════════ TAB BAR ════════ -->
<div class="tab-bar">
  <div class="tab-nav" role="tablist">
    <button class="tab-btn" data-tab="growth" type="button">
      <span class="tab-dot"></span>Growth
    </button>
    <button class="tab-btn" data-tab="sales" type="button">
      <span class="tab-dot"></span>Sales
    </button>
    <button class="tab-btn" data-tab="omni" type="button">
      <span class="tab-dot"></span>OMNI
    </button>
    <button class="tab-btn active" data-tab="brand" type="button">
      <span class="tab-dot"></span>자사몰
    </button>
  </div>
</div>

<!-- ════════ MAIN FRAME ════════ -->
<div class="main-frame">
  <div class="frame-loading" id="frameLoading">
    <div class="spinner"></div>
    <div class="txt" id="frameLoadingText">대시보드 불러오는 중…</div>
  </div>
  <iframe class="dash-frame hidden" data-tab="growth" id="frame-growth" title="Growth 대시보드"></iframe>
  <iframe class="dash-frame hidden" data-tab="sales"  id="frame-sales"  title="Sales 대시보드"></iframe>
  <iframe class="dash-frame hidden" data-tab="omni"   id="frame-omni"   title="OMNI 대시보드"></iframe>
  <iframe class="dash-frame hidden" data-tab="brand"  id="frame-brand"  title="자사몰 대시보드"></iframe>
</div>

<!-- ════════ FIREBASE + 엑셀 업로드 ════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSlAHgeIlezNolFRAZMN01_ufv7H2B0os",
  authDomain: "omni-dashboard-f8c8f.firebaseapp.com",
  projectId: "omni-dashboard-f8c8f",
  storageBucket: "omni-dashboard-f8c8f.firebasestorage.app",
  messagingSenderId: "870860751768",
  appId: "1:870860751768:web:bbb95c387ed9cc967161ed"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TABS = {
  growth: { url: 'growth.html?embedded=1', label: 'Growth', template: null },
  sales:  { url: 'sales.html?embedded=1',  label: 'Sales',  template: 'SALES_월매출_업로드양식.xlsx' },
  omni:   { url: 'omni.html?embedded=1',   label: 'OMNI',   template: 'OMNI_월매출_업로드양식.xlsx' },
  brand:  { url: 'brand.html?embedded=1',  label: '자사몰', template: null },
};
const DEFAULT_TAB = 'brand';
let currentTab = null;

function setStatus(state, msg){
  const dot = document.getElementById('dbStatusDot');
  const txt = document.getElementById('dbStatusText');
  dot.classList.remove('connecting','error');
  if (state === 'connecting') dot.classList.add('connecting');
  else if (state === 'error') dot.classList.add('error');
  txt.textContent = msg;
}

function showToast(msg){
  let t = document.getElementById('shellToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'shellToast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function switchTab(tabKey){
  if (!TABS[tabKey] || currentTab === tabKey) return;

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabKey);
  });
  document.querySelectorAll('.dash-frame').forEach(f => {
    f.classList.toggle('hidden', f.dataset.tab !== tabKey);
  });

  const frame = document.getElementById('frame-' + tabKey);
  const loading = document.getElementById('frameLoading');
  const loadingText = document.getElementById('frameLoadingText');
  if (!frame.src || frame.src === 'about:blank' || frame.src.endsWith('/')) {
    loadingText.textContent = `${TABS[tabKey].label} 대시보드 불러오는 중…`;
    loading.classList.remove('hidden');
    frame.onload = () => loading.classList.add('hidden');
    frame.onerror = () => { loadingText.textContent = `${TABS[tabKey].label} 대시보드를 불러올 수 없습니다.`; };
    frame.src = TABS[tabKey].url;
  } else {
    loading.classList.add('hidden');
  }

  const dlBtn = document.getElementById('downloadTemplateBtn');
  const template = TABS[tabKey].template;
  if (template) {
    dlBtn.href = template;
    dlBtn.style.display = '';
    dlBtn.title = `${TABS[tabKey].label} 엑셀 양식 다운로드`;
  } else {
    dlBtn.style.display = 'none';
  }

  if (window.location.hash !== '#' + tabKey) {
    history.replaceState(null, '', '#' + tabKey);
  }
  currentTab = tabKey;
}

const monthDocId = (y, m) => `${y}-${String(m).padStart(2,'0')}`;

async function handleExcelUpload(file){
  const loading = document.getElementById('frameLoading');
  const loadingText = document.getElementById('frameLoadingText');
  loadingText.textContent = '엑셀 파일 분석 중…';
  loading.classList.remove('hidden');

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    let year = null, month = null;
    for (const r of rows) {
      if (!r) continue;
      const a = (r[0]||'').toString();
      const c = (r[2]||'').toString();
      if (a.includes('기준 년도')) year = Number(r[1]) || null;
      if (a.includes('기준 월') || c.includes('기준 월')) {
        month = Number(r[3]) || Number(r[1]) || null;
      }
    }
    if (!year || !month) throw new Error('기준 년도/월을 읽을 수 없습니다.');

    const headerIdx = rows.findIndex(r => r && r[0] && r[0].toString().includes('채널 구분'));
    if (headerIdx < 0) throw new Error('엑셀 양식이 잘못됐습니다.');

    const dataRows = rows.slice(headerIdx + 1).filter(r => {
      if (!r || r.length === 0) return false;
      const v = (r[1]||'').toString();
      if (v.includes('총합')) return false;
      if (r[0] && r[0].toString().startsWith('📘')) return false;
      if (r[0] && /^[0-9]+\./.test(r[0].toString())) return false;
      return true;
    });

    const channelNames = dataRows.filter(r => r && r[1]).map(r => r[1].toString().trim());
    const isOmni  = channelNames.includes('D2C') || channelNames.includes('오프라인');
    const isSales = channelNames.includes('B2B');

    let data;
    if (isOmni) data = parseOmniExcel(year, month, dataRows);
    else if (isSales) data = parseSalesExcel(year, month, dataRows);
    else throw new Error('알 수 없는 엑셀 양식입니다.');

    loadingText.textContent = 'Firebase에 저장 중…';
    await setDoc(doc(db, 'monthlyData', monthDocId(year, month)), data);

    refreshAllFrames();
    const type = isOmni ? 'OMNI' : 'SALES';
    showToast(`✓ ${type} ${year}년 ${month}월 데이터가 저장되었습니다.`);
  } catch(e) {
    console.error(e);
    showToast('업로드 실패: ' + (e.message || e));
  } finally {
    setTimeout(() => document.getElementById('frameLoading').classList.add('hidden'), 300);
  }
}

function parseOmniExcel(year, month, dataRows){
  const channels = { d2c:{subs:{}}, b2c:{subs:{}}, etc:{subs:{}}, off:{subs:{}} };
  const NAME_TO_CH = { 'D2C':'d2c', 'B2C':'b2c', '기타':'etc', '오프라인':'off' };
  const SUB_NAME_TO_KEY = {
    '브랜드몰':'brandshop', '네이버':'naver',
    'SSG':'ssg', '현대투홈':'hyundai', 'KB헬스케어':'kb', '기타':'b2c_etc',
    '신세계 강남':'sinsegae_gn', '신세계 청담':'sinsegae_cd'
  };
  let currentParent = null;
  for (const r of dataRows) {
    const chName = (r[1] || '').toString().trim();
    const subName = (r[2] || '').toString().trim().replace(/^└\s*/,'').replace(/^\(.*\)$/,'').trim();
    const sales = Number(r[3]) || 0;
    const target = Number(r[4]) || 0;
    const prev = (r[5] === '' || r[5] == null) ? null : Number(r[5]);
    const maxDate = (r[6] || '').toString().trim();
    const maxAmt = (r[7] === '' || r[7] == null) ? null : Number(r[7]);
    const minDate = (r[8] || '').toString().trim();
    const minAmt = (r[9] === '' || r[9] == null) ? null : Number(r[9]);

    if (NAME_TO_CH[chName]) {
      currentParent = NAME_TO_CH[chName];
      const isParentRow = !subName || /합계/.test(r[2]||'');
      if (currentParent === 'etc' && isParentRow) {
        channels.etc.sales = sales;
        channels.etc.target = target;
        channels.etc.prevYear = prev;
        if (maxDate || maxAmt != null) channels.etc.max = { date: maxDate, amount: maxAmt };
        if (minDate || minAmt != null) channels.etc.min = { date: minDate, amount: minAmt };
      }
      continue;
    }
    if (currentParent && subName) {
      const subKey = SUB_NAME_TO_KEY[subName];
      if (!subKey) continue;
      channels[currentParent].subs[subKey] = {
        sales, target, prevYear: prev,
        max: (maxDate || maxAmt != null) ? { date: maxDate, amount: maxAmt } : null,
        min: (minDate || minAmt != null) ? { date: minDate, amount: minAmt } : null,
      };
    }
  }
  return { year, month, uploadedAt: new Date().toISOString(), channels };
}

function parseSalesExcel(year, month, dataRows){
  const channels = { b2b:{subs:{}}, b2c:{subs:{}} };
  const NAME_TO_CH = { 'B2B':'b2b', 'B2C':'b2c' };
  const SUB_NAME_TO_KEY = {
    '웰스토리':'welstory', '스타벅스':'starbucks', 'CJ프레시웨이':'cj', '캠퍼스파트너스':'campus',
    'HSP':'hsp', '컬리':'kurly', '롯데마트':'lottemart', '이마트':'emart',
    'SSG-직매입':'ssg_direct', 'SSG 직매입':'ssg_direct',
    'GS리테일':'gs', 'GS 리테일':'gs',
  };
  let currentParent = null;
  for (const r of dataRows) {
    const chName = (r[1] || '').toString().trim();
    const subName = (r[2] || '').toString().trim().replace(/^└\s*/,'').replace(/^\(.*\)$/,'').trim();
    const sales = Number(r[3]) || 0;
    const target = Number(r[4]) || 0;
    const prev = (r[5] === '' || r[5] == null) ? null : Number(r[5]);
    const maxDate = (r[6] || '').toString().trim();
    const maxAmt = (r[7] === '' || r[7] == null) ? null : Number(r[7]);
    const minDate = (r[8] || '').toString().trim();
    const minAmt = (r[9] === '' || r[9] == null) ? null : Number(r[9]);

    if (NAME_TO_CH[chName]) {
      currentParent = NAME_TO_CH[chName];
      continue;
    }
    if (currentParent && subName) {
      let subKey = SUB_NAME_TO_KEY[subName];
      if (!subKey && subName === '기타') subKey = currentParent + '_etc';
      if (!subKey) continue;
      channels[currentParent].subs[subKey] = {
        sales, target, prevYear: prev,
        max: (maxDate || maxAmt != null) ? { date: maxDate, amount: maxAmt } : null,
        min: (minDate || minAmt != null) ? { date: minDate, amount: minAmt } : null,
      };
    }
  }
  return { year, month, uploadedAt: new Date().toISOString(), channels };
}

function refreshAllFrames(){
  document.querySelectorAll('.dash-frame').forEach(f => {
    if (f.src && f.src !== 'about:blank' && !f.src.endsWith('/')) {
      try {
        f.contentWindow.location.reload();
      } catch(e) {
        const s = f.src; f.src = ''; f.src = s;
      }
    }
  });
}

async function checkFirebaseConnection(){
  setStatus('connecting', 'Firebase 연결 확인 중…');
  try {
    await getDoc(doc(db, 'monthlyData', '__connection_test__'));
    setStatus('ok', '서버 데이터 연동됨');
  } catch(e) {
    console.error('Firebase connection failed:', e);
    if (location.protocol === 'file:') {
      setStatus('error', '로컬 파일로 열렸음 — http 서버 필요');
    } else {
      setStatus('error', 'Firebase 연결 실패');
    }
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleExcelUpload(file);
  e.target.value = '';
});
window.addEventListener('hashchange', () => {
  const tab = location.hash.replace('#','');
  if (TABS[tab]) switchTab(tab);
});

// 초기
checkFirebaseConnection();
const initialTab = (location.hash && TABS[location.hash.replace('#','')])
  ? location.hash.replace('#','')
  : DEFAULT_TAB;
switchTab(initialTab);
</script>
</body>
</html>
